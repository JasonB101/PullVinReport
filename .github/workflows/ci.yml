name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run on the same branch has nothing useful left to say.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Builds with no credentials on purpose: the paid path must stay closed
      # rather than fall back to sample data when the provider is unconfigured.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
